services:
  api:
    build: ./bde-events-api
    image: kaoutarouissa25/bde-events-api:v2
    container_name: bde-events-api
    ports:
      - "8000:8000"

  react:
    build: ./bde-events-react
    image: kaoutarouissa25/bde-events-react:v2
    container_name: bde-events-react
    ports:
      - "8080:80"
    depends_on:
      - api
